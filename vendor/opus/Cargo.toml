[package]
name = "opus"
version = "0.4.0"
authors = ["Tad Hardesty <tad@platymuus.com>"]

description = "Safe Rust bindings for libopus"
readme = "README.md"
license = "MIT/Apache-2.0"
keywords = ["opus", "codec", "voice", "sound", "audio"]
categories = ["api-bindings", "encoding", "compression",
	"multimedia::audio", "multimedia::encoding"]

repository = "https://github.com/SpaceManiac/opus-rs"

edition = "2015"

[dependencies]
# Patched for snapcast-rs: link the system libopus instead of building the
# bundled copy (opusic-sys enables `bundled` by default). This is the only
# change from the crates.io release of opus 0.4.0.
opusic-sys = { version = "0.7.3", default-features = false }
