[package]
name = "flac-encoder-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone evaluation tool — deliberately its own workspace root so Cargo
# never infers membership in the parent snapcast-rs workspace.
# Not a dependency of anything. See ../../docs/flac-encoder-evaluation.md.
[workspace]

[dependencies]
# default-features = false: drops the `par` (crossbeam-channel), `log`, and
# `serde` features — irrelevant for our one-block-at-a-time use (`par`
# parallelizes across many blocks of a whole in-memory source, which doesn't
# apply when blocks arrive one at a time from a live network stream). This is
# also the leaner, validated configuration referenced in the findings doc.
flacenc = { version = "0.5", default-features = false }
oxideav-flac = "0.0.11"
oxideav-core = "0.1"
symphonia = { version = "0.5", features = ["flac"] }
