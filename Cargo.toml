[workspace]
resolver = "3"
members = ["crates/snapcast-proto", "crates/snapcast-client", "crates/snapcast-server", "crates/snapclient-rs", "crates/snapserver-rs", "crates/snapcast-tests"]

[workspace.package]
version = "0.99.19"
edition = "2024"
rust-version = "1.94.1"
license = "GPL-3.0-only"
repository = "https://github.com/pbtrung/snapcast-rs"
authors = ["Trung Pham"]

[workspace.dependencies]
# Internal
snapcast-proto = { path = "crates/snapcast-proto", version = "0.99.19" }
snapcast-client = { path = "crates/snapcast-client", version = "0.99.19", default-features = false }
snapcast-server = { path = "crates/snapcast-server", version = "0.99.19", default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }
socket2 = { version = "0.6", features = ["all"] }

# Buffers
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Binary protocol
byteorder = "1"

# Auth
base64 = "0.23"
subtle = "2"

# Hostname
hostname = "0.4"
mac_address = "1"
libc = "0.2"

# Networking
tokio-tungstenite = { version = "0.30", features = ["connect"] }
futures-util = "0.3"

# Audio decoding
symphonia = { version = "0.6", default-features = false, features = ["flac"] }
# Builds libopus from source (opusic-sys `bundled`); needs cmake + a C compiler.
opus = "0.4"

# Audio resampling
rubato = "5"

# Audio backends
alsa = "0.11"  # must match the version cpal uses (shared alsa-sys)

# Property tests (dev)
proptest = "1"


[profile.release]
lto = true
strip = true
codegen-units = 1
