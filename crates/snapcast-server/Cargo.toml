[package]
name = "snapcast-server"
description = "Snapcast server library — embeddable synchronized multiroom audio server"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
subtle = { workspace = true }
snapcast-proto = { workspace = true }
tokio = { workspace = true }
socket2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

# Encoders — all optional.
# flacenc is a pure-Rust FLAC encoder (no C toolchain / system library needed).
# default-features off drops its `par`/`log`/`serde` features — we encode one
# block at a time, so the parallel path doesn't apply. See
# docs/flac-encoder-evaluation.md for the evaluation behind this choice.
flacenc = { version = "0.5", default-features = false, optional = true }
opus = { workspace = true, optional = true }
uuid = { version = "1.23.0", features = ["v4"] }

[features]
default = ["flac"]
flac = ["dep:flacenc"]
opus = ["dep:opus"]

[dev-dependencies]

[package.metadata.docs.rs]
all-features = false
