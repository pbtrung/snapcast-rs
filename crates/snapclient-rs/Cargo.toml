[package]
name = "snapclient-rs"
description = "Snapcast client — synchronized multiroom audio player"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "snapclient-rs"
path = "src/main.rs"

[dependencies]
snapcast-client = { workspace = true }
snapcast-proto = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
libc = { workspace = true }
cpal = "0.18"
mdns-sd = { workspace = true, optional = true }



[features]
default = ["mdns", "websocket"]
mdns = ["dep:mdns-sd"]
websocket = ["snapcast-client/websocket"]
resampler = ["snapcast-client/resampler"]

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { workspace = true }
sd-notify = "0.5"
